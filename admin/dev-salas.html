<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>001 — Admin</title>
<style>
body{margin:0;background:#0b1017;color:#eaf1f8;font:14px Consolas,"Courier New",monospace}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill,.card{border:1px solid #2c435a;background:#101923;border-radius:8px}.pill{padding:6px 9px}.grid{display:grid;gap:10px;margin-top:18px}.card{padding:14px}h1,h2{margin:0}.muted{color:#8295a8}.players{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.player{border:1px solid #31475d;padding:4px 7px;border-radius:999px}.ok{color:#65d99b}.off{color:#ff8585}button{background:#e0b943;border:0;border-radius:6px;padding:8px 10px;font-weight:900;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{padding:7px;border-bottom:1px solid #233446;text-align:left;font-size:12px}
</style>
</head>
<body><main class="wrap"><div class="top"><div><h1>001 // ADMIN</h1><div class="muted">salas ao vivo e histórico opcional do MongoDB</div></div><button id="refresh">ATUALIZAR</button></div><div id="status" class="pill" style="margin-top:15px">carregando...</div><h2 style="margin-top:24px">SALAS AO VIVO</h2><div id="rooms" class="grid"></div><h2 style="margin-top:24px">PARTIDAS RECENTES</h2><div id="matches" class="card"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const [r,m]=await Promise.all([fetch('/api/admin/rooms').then(x=>x.json()),fetch('/api/admin/matches?limit=50').then(x=>x.json())]);document.querySelector('#status').innerHTML=`MongoDB: <b class="${r.storage?.enabled?'ok':'off'}">${r.storage?.enabled?'ATIVO':'DESATIVADO'}</b> • ${r.rooms?.length||0} sala(s)`;const rooms=document.querySelector('#rooms');rooms.innerHTML='';for(const room of r.rooms||[]){const card=document.createElement('div');card.className='card';card.innerHTML=`<b>${esc(room.code)}</b> • ${esc(room.status)} • ${room.playerCount} participante(s)<div class="muted">jogo ${room.gameNo} • atualizada ${new Date(room.updatedAt).toLocaleString()}</div><div class="players">${room.players.map(p=>`<span class="player">${esc(p.name)} • ${esc(p.type)} • ${p.connected?'online':'offline'}</span>`).join('')}</div>`;rooms.appendChild(card)}if(!rooms.children.length)rooms.innerHTML='<div class="card muted">Nenhuma sala ativa.</div>';const matches=document.querySelector('#matches');if(!m.storage?.enabled){matches.innerHTML='<span class="muted">MongoDB não configurado. O jogo funciona normalmente, mas o histórico persistente fica desativado.</span>';return}matches.innerHTML='<table><thead><tr><th>Data</th><th>Sala</th><th>Vencedor</th><th>Jogadores</th><th>Duração</th></tr></thead><tbody>'+((m.matches||[]).map(x=>`<tr><td>${x.finishedAt?new Date(x.finishedAt).toLocaleString():'—'}</td><td>${esc(x.roomCode)}</td><td>${esc(x.winnerName||'—')}</td><td>${(x.players||[]).map(p=>esc(p.name)).join(', ')}</td><td>${x.durationMs?Math.round(x.durationMs/1000)+'s':'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nenhuma partida registrada.</td></tr>')+'</tbody></table>'}
document.querySelector('#refresh').onclick=load;load();setInterval(load,15000);
</script></body></html>
